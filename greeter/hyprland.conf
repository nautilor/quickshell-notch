# Hyprland config for the greetd login screen (classic .conf format; Hyprland removes it in 0.57, use hyprland.lua then).
# greetd starts Hyprland with this file; Hyprland starts the greeter and exits when it is done.
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}
animations {
    enabled = false
}
monitor = , preferred, auto, 1
exec-once = quickshell -p /etc/quickshell-notch/greeter.qml; hyprctl dispatch exit
